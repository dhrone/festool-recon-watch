name: Recon watch

on:
  # The 15-minute timer is cron-job.org calling workflow_dispatch (every :00/:15/:30/:45).
  # No GitHub schedule: it drops and delays runs (45% of a 3-hourly schedule never ran,
  # Sep-Nov 2026; this repo's never fired in its first two hours), and a backup would double
  # the requests to Recon once it did. healthchecks.io alerts if the timer stops.
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: recon-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A run that waited for a runner past the next slot is stale: the next run covers it,
      # and its state would conflict with the commits made meanwhile (2026-11-16 17:00 run,
      # queued 69 min). Skip it (success, so healthchecks.io stays quiet).
      - name: Skip if queued too long
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at) || created=""
          [ -n "$created" ] || { echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; }  # can't tell: run it
          age=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "created $created, queued ${age}s"
          if [ "$age" -gt 600 ]; then echo "stale run; skipping"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        if: steps.fresh.outputs.ok == 'true'
        with:
          ref: main  # the latest state, not the commit at dispatch time

      - name: Check festoolrecon.com
        if: steps.fresh.outputs.ok == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 recon_watch.py --now

      - name: Save state when it changed
        if: steps.fresh.outputs.ok == 'true'
        run: |
          git add state/recon-state.json logs/alerts.log
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="recon-watch" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "state: $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if ! git pull -q --rebase; then
              # A newer run committed state meanwhile: its state is newer, keep it.
              git rebase --abort; echo "state conflict; keeping the newer commit"; exit 0
            fi
            git push -q && exit 0; sleep 5
          done
          exit 1

      - name: Ping healthchecks.io (missed-check alarm)
        if: always()
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          [ -n "$HC_PING_URL" ] || { echo "HC_PING_URL not set"; exit 0; }
          suffix=""; [ "${{ job.status }}" = "success" ] || suffix="/fail"
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL$suffix" || echo "ping failed"

      - name: Alert if this workflow itself failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -sS -H "Title: Recon watch run failed" -H "Priority: high" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "The Festool Recon check failed; the Actions watcher will look at it too." "https://ntfy.sh/$NTFY_TOPIC"
